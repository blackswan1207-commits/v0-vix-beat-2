name: Update FBI Rankings

on:
  workflow_dispatch:               # 僅支援手動觸發（本機 launchd 負責排程）

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch FBI data and update Gist
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: node .github/scripts/fetch-fbi.mjs
